# 专家概念图:主题 1(AGI)。
# !! 草稿 !! 由 materials/article_1_*(旧版阅读材料)整理,格式仿照 topic_2.yaml。
# 研究团队还没有给出这个主题的正式概念图;正式版出来后整个替换本文件,并删掉 draft: true。
#
# 两方材料立场相反:受试者材料主张 AGI 已实现(按行为评估、训练能产生 world model 与广泛能力),
# AI 学伴材料主张不可能(需要真正理解、统计学习不同于人的经验学习)。contributor 按概念主要出自哪一方标注。
# 字段含义见 topic_2.yaml;negated: true 表示材料里这条命题本身是否定句("X 不能衡量 Y")。

topic: 1
title: AGI
draft: true

concepts:
  agi:                      {round: 1, contributor: user}
  behavioral_evaluation:    {round: 1, contributor: user}
  turing_test:              {round: 1, contributor: user}
  understanding:            {round: 1, contributor: peer}
  next_token_prediction:    {round: 2, contributor: peer}
  world_model:              {round: 2, contributor: user}
  experiential_learning:    {round: 3, contributor: peer}
  broad_competence:         {round: 3, contributor: user}
  intelligence_attribution: {round: 3, required: false}   # 终点:是否认定 AGI 已实现,不计入覆盖率

propositions:
  # ---- Round 1: What is AGI, and how do we measure it?
  - {id: "1.1", source: agi, verb: is, target_text: "An AI system that performs well across a broad range of cognitive tasks",
     statement: "AGI is an AI system that performs well across a broad range of cognitive tasks, not just one."}
  - {id: "1.2", source: agi, verb: has, target_text: "No universally accepted definition or clear threshold",
     statement: "AGI has no universally accepted definition or clear threshold for when it is achieved."}
  - {id: "1.3", source: agi, verb: requires, target: understanding,
     accept: [DEPENDS_ON],
     statement: "AGI requires understanding, not only correct answers."}
  - {id: "2.1", source: behavioral_evaluation, verb: judges, target_text: "Intelligence by what a system can do rather than how it works",
     statement: "Behavioral evaluation judges intelligence by what a system can do rather than how it works."}
  - {id: "2.2", source: behavioral_evaluation, verb: is how, target_text: "Human intelligence is assessed",
     statement: "Behavioral evaluation is also how human intelligence is assessed."}
  - {id: "2.3", source: behavioral_evaluation, verb: measures, target: agi,
     accept: [MEASURES],
     statement: "Behavioral evaluation measures AGI."}
  - {id: "2.4", source: behavioral_evaluation, verb: includes, target: turing_test,
     accept: [INCLUDES],
     statement: "Behavioral evaluation includes the Turing Test."}
  - {id: "3.1", source: turing_test, verb: asks, target_text: "Whether judges can tell a machine from a person in conversation",
     statement: "The Turing Test asks whether human judges can tell a machine from a person in conversation."}
  - {id: "3.2", source: turing_test, verb: was passed by, target_text: "GPT-4.5 in about 73% of conversations",
     statement: "GPT-4.5 was judged to be human in about 73% of Turing Test conversations."}
  - {id: "3.3", source: turing_test, verb: does not measure, target: understanding, negated: true,
     accept: [MEASURES],
     statement: "The Turing Test does not measure understanding."}
  - {id: "4.1", source: understanding, verb: means, target_text: "Grasping meaning, not only producing correct answers",
     statement: "Understanding means grasping meaning, not only producing correct answers."}
  - {id: "4.2", source: understanding, verb: is not shown by, target_text: "Imitating human-like responses",
     statement: "Imitating human-like responses does not show understanding."}

  # ---- Round 2: How is AI trained?
  - {id: "5.1", source: next_token_prediction, verb: trains, target_text: "A model by predicting the next word in large amounts of text",
     statement: "Next-token prediction trains a model by repeatedly predicting the next word in large amounts of text."}
  - {id: "5.2", source: next_token_prediction, verb: relies on, target_text: "Statistical relationships and probability",
     statement: "Next-token prediction relies on statistical relationships and probability."}
  - {id: "5.3", source: next_token_prediction, verb: can produce, target: world_model,
     accept: [CAUSES, ENHANCES, LEARNS],
     statement: "Next-token prediction can produce world models."}
  - {id: "5.4", source: next_token_prediction, verb: differs from, target: experiential_learning,
     accept: [DIFFERS_FROM],
     statement: "Next-token prediction is different from experiential learning."}
  - {id: "6.1", source: world_model, verb: is, target_text: "An internal representation a model forms during training",
     statement: "A world model is an internal representation a model forms during training."}
  - {id: "6.2", source: world_model, verb: lets, target_text: "A system generalize, predict and reason about new situations",
     statement: "World models let a system generalize, predict and reason about new situations."}
  - {id: "6.3", source: world_model, verb: enables, target: broad_competence,
     accept: [CAUSES, ENHANCES],
     statement: "World models enable broad competence."}

  # ---- Round 3: How has human intelligence emerged, and how is it assessed?
  - {id: "7.1", source: experiential_learning, verb: is, target_text: "How humans learn through perception, action and trial and error",
     statement: "Experiential learning is how humans learn through perception, action, and trial and error."}
  - {id: "7.2", source: experiential_learning, verb: lets, target_text: "Humans learn independently and transfer knowledge",
     statement: "Experiential learning lets humans learn independently and transfer knowledge to new situations."}
  - {id: "7.3", source: experiential_learning, verb: builds, target: understanding,
     accept: [LEARNS, CAUSES, ENHANCES],
     statement: "Experiential learning builds understanding."}
  - {id: "8.1", source: broad_competence, verb: means, target_text: "Performing well across language, math, reasoning and creative tasks",
     statement: "Broad competence means performing well across language, math, reasoning, and creative tasks."}
  - {id: "8.2", source: broad_competence, verb: is judged from, target_text: "Many independent evaluations rather than one benchmark",
     statement: "Broad competence is judged from many independent evaluations, not a single benchmark."}
  - {id: "8.3", source: broad_competence, verb: supports, target: intelligence_attribution,
     accept: [ENHANCES, CAUSES],
     statement: "Broad competence supports attributing general intelligence."}
  - {id: "9.1", source: intelligence_attribution, verb: requires, target: understanding,
     accept: [DEPENDS_ON],
     statement: "Attributing general intelligence requires understanding."}
